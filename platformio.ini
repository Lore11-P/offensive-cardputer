; ============================================================================
;  CardputerFirmware v1.0 - M5Stack Cardputer ADV (ESP32-S3FN8)
;  Framework: Arduino / PlatformIO
;  Target: ESP32-S3, 8 MB flash, 320 KB SRAM, NESSUNA PSRAM.
;  Nota: il firmware evita allocazioni PSRAM e usa un framebuffer da ~65 KB.
; ============================================================================

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; La USB nativa della Cardputer (USB-Serial-JTAG) e' instabile a 1,5 Mbaud:
; con 460800 l'upload e' piu' lento ma affidabile.
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ----------------------------------------------------------------------------
; Flag di compilazione
; ----------------------------------------------------------------------------
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DESP32S3
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=1
    ; Stack del task dei menu (setup/loop): 8 KB non bastavano per i menu a
    ; carosello con icone vettoriali di fallback (stack canary su loopTask).
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; --- Moduli compilati nel binario (1 = incluso, 0 = escluso) -------------
    -DENABLE_MODULE_BLE=1
    -DENABLE_MODULE_WIFI=1
    -DENABLE_MODULE_IR=1
    -DENABLE_MODULE_GAMES=1
    -DENABLE_MODULE_SETTINGS=1
    -DENABLE_MODULE_SD=1
    -DENABLE_MODULE_RADAR=1
    -DENABLE_MODULE_RADIO=1
    ; Presenza via Wi-Fi CSI (sperimentale): 0 per escluderla dal binario.
    -DENABLE_RADAR_CSI=1
    ; --- Funzioni offensive: disabilitate di default ------------------------
    ; Impostare a 1 solo per test su proprie reti in ambiente RF isolato.
    ; Gate richiesto dal progetto: BLE spam, deauth, evil twin, evil portal,
    ; IR jammer. Deve restare 0 nella build pubblica.
    -DENABLE_OFFENSIVE=0
    ; --- Pin hardware Cardputer ADV ----------------------------------------
    -DIR_TX_PIN=44
    -DSD_CS_PIN=12
    -DSD_MOSI_PIN=14
    -DSD_SCK_PIN=40
    -DSD_MISO_PIN=39
; -DENABLE_IR_LEARN=1     ; richiede un ricevitore IR esterno (vedi README)

; ----------------------------------------------------------------------------
; Dipendenze
; ----------------------------------------------------------------------------
lib_deps =
    m5stack/M5Cardputer
    m5stack/M5Unified
    h2zero/NimBLE-Arduino@1.4.3
    crankyoldgit/IRremoteESP8266@^2.8.6
    esphome/ESPAsyncWebServer-esphome@3.4.0
    esphome/AsyncTCP-esphome@2.1.4
    bblanchon/ArduinoJson@^7.0.0
    ; Decoder MP3/AAC per la web radio (opzione A).
    esphome/ESP32-audioI2S@^2.3.0

; ----------------------------------------------------------------------------
; Variante di test con funzioni offensive abilitate.
; NON usare questa build in pubblico: deauth/evil twin/evil portal/BLE spam/
; jammer IR sono attivi. Solo su reti e dispositivi propri, in ambiente RF
; isolato e con autorizzazione.
; ----------------------------------------------------------------------------
[env:cardputer-adv-offensive]
extends = env:cardputer-adv
build_unflags =
    ${env:cardputer-adv.build_unflags}
    -DENABLE_OFFENSIVE=0
build_flags =
    ${env:cardputer-adv.build_flags}
    -DENABLE_OFFENSIVE=1

; ----------------------------------------------------------------------------
; Ambiente "native" usato solo per test logici host-side (parser IR).
; Il firmware reale non viene compilato in questo ambiente.
; ----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
test_ignore = test_embedded
