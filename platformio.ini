; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = 
	-std=gnu++11
build_flags = 
	-std=gnu++17
	-DESP32S3
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_LOOP_STACK_SIZE=16384
	-DENABLE_MODULE_BLE=1
	-DENABLE_MODULE_CHAT=1
	-DENABLE_MODULE_WIFI=1
	-DENABLE_MODULE_IR=1
	-DENABLE_MODULE_GAMES=0
	; Giochi nativi sempre disponibili: solo i 5 titoli dello Store (~28 KB
	; di flash, 0 RAM statica). L'arcade completo resta in ENABLE_MODULE_GAMES.
	-DENABLE_HOT_GAMES=1
	-DENABLE_MODULE_SETTINGS=1
	-DENABLE_MODULE_SD=1
	-DENABLE_MODULE_RADAR=1
	-DENABLE_MODULE_RADIO=1
	-DENABLE_MODULE_MUSIC=1
	-DENABLE_MODULE_PCAPTOOLS=1
	-DENABLE_MODULE_BLEEXT=1
	-DENABLE_MODULE_AUDIO=1
	-DENABLE_MODULE_BLEHID=1
	-DENABLE_MODULE_TOOLS=1
	-DENABLE_MODULE_WIFILAB=1
	-DENABLE_MODULE_WPASEC=1
	-DENABLE_MODULE_SENSORS=1
	-DENABLE_MODULE_WIFIEXT=1
	-DENABLE_MODULE_ESPNOW=1
	-DENABLE_MODULE_BADUSB=0
	-DENABLE_RADAR_CSI=1
	-DENABLE_OFFENSIVE=0
	-DIR_TX_PIN=44
	-DSD_CS_PIN=12
	-DSD_MOSI_PIN=14
	-DSD_SCK_PIN=40
	-DSD_MISO_PIN=39
lib_deps = 
	m5stack/M5Cardputer@1.1.1
	m5stack/M5Unified@0.2.29
	m5stack/M5GFX@0.2.36
	h2zero/NimBLE-Arduino@1.4.3
	crankyoldgit/IRremoteESP8266@2.9.0
	esphome/ESPAsyncWebServer-esphome@3.4.0
	esphome/AsyncTCP-esphome@2.1.4
	bblanchon/ArduinoJson@7.4.3
	esphome/ESP32-audioI2S@2.3.0
	ricmoo/QRCode
platform_packages = platformio/tool-openocd-esp32@^2.1200.20230419

[env:cardputer-adv-offensive]
extends = env:cardputer-adv
build_unflags = 
	${env:cardputer-adv.build_unflags}
	-DENABLE_OFFENSIVE=0
build_flags = 
	${env:cardputer-adv.build_flags}
	-DENABLE_OFFENSIVE=1
platform_packages = platformio/tool-openocd-esp32@^2.1200.20230419

[env:cardputer-adv-hid]
extends = env:cardputer-adv
build_unflags = 
	${env:cardputer-adv.build_unflags}
	-DARDUINO_USB_MODE=1
	-DENABLE_MODULE_BADUSB=0
build_flags = 
	${env:cardputer-adv.build_flags}
	-DENABLE_MODULE_BADUSB=1
	-DARDUINO_USB_MODE=0
	-DORBIT_DISABLE_LOGGER=1
platform_packages = platformio/tool-openocd-esp32@^2.1200.20230419

[env:cardputer-adv-diag]
extends = env:cardputer-adv
build_flags = 
	${env:cardputer-adv.build_flags}
	-DORBIT_DIAG_AUTOGAME=1
	-DORBIT_DIAG_CONSOLE=1
platform_packages = platformio/tool-openocd-esp32@^2.1200.20230419

[env:cardputer-adv-serlog]
extends = env:cardputer-adv
build_flags = 
	${env:cardputer-adv.build_flags}
	-DORBIT_DIAG_LOG=1
	-DORBIT_DIAG_CONSOLE=1
platform_packages = platformio/tool-openocd-esp32@^2.1200.20230419

[env:cardputer-adv-probe]
extends = env:cardputer-adv
build_flags = 
	${env:cardputer-adv.build_flags}
	-DORBIT_DIAG_LOG=1
	-DORBIT_DIAG_BOOTGAME=1
	-DORBIT_DIAG_CONSOLE=1
platform_packages = platformio/tool-openocd-esp32@^2.1200.20230419

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
test_ignore = test_embedded
platform_packages = platformio/tool-openocd-esp32@^2.1200.20230419
